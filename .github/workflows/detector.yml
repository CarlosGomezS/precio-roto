name: Detector de errores de precio

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:          # botón para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: detector
  cancel-in-progress: false

jobs:
  detectar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El historial de precios se guarda en la caché de GitHub, no en el repositorio,
      # porque con catálogos grandes ocupa demasiado.
      - name: Recuperar historial de precios
        uses: actions/cache/restore@v4
        with:
          path: precios.db
          key: precios-${{ github.run_id }}
          restore-keys: precios-

      - name: Buscar errores de precio
        env:
          AWIN_FEEDLIST_URL: ${{ secrets.AWIN_FEEDLIST_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python detector.py

      - name: Guardar historial de precios
        if: always()
        uses: actions/cache/save@v4
        with:
          path: precios.db
          key: precios-${{ github.run_id }}

      - name: Publicar alertas en la web
        run: |
          git config user.name "precio-roto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add deals.json
          git diff --cached --quiet || git commit -m "Actualizar alertas"
          git pull --rebase -q && git push
